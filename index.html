<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Life Projects V1.0</title>
<style>
:root{--navy:#0b1f3a;--navy2:#132d4f;--page:#f4f6f8;--surface:#fff;--text:#17202a;--muted:#647282;--border:#dbe2e8;--blue:#2e5f92;--blueSoft:#edf4fb;--green:#2f7d5a;--greenSoft:#e7f4ed;--amber:#a56a13;--amberSoft:#fff4da;--red:#b74747;--redSoft:#fde8e8;--r:12px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}.bar{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.brand{font-weight:800;letter-spacing:.4px;cursor:pointer}.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy2)}.nav button{border:0;background:transparent;color:#bfd0e3;padding:11px 3px;font-size:11px;font-weight:800}.nav button.active{color:#fff;border-bottom:3px solid #fff}.btn{border:1px solid var(--border);background:#fff;border-radius:8px;min-height:38px;padding:7px 11px;font-weight:700;color:var(--navy)}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.bar .btn{background:#fff;color:var(--navy)}main{max-width:820px;margin:auto;padding:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric,.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:11px}.metric b{font-size:18px;display:block;color:var(--navy)}.metric span,.meta{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.section{margin:17px 2px 8px;font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.5px}.card{margin-bottom:9px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.title{font-weight:900;color:var(--navy)}.progress{height:5px;background:#e6ebf0;border-radius:9px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--blue)}.label{font-size:10px;letter-spacing:.35px;color:var(--muted);font-weight:900;margin-top:9px}.value{margin-top:2px}.blocked{border-left:4px solid var(--red)}.pill{font-size:10px;font-weight:800;border-radius:20px;padding:3px 7px;background:var(--blueSoft);color:var(--blue)}.actions{display:flex;gap:7px;margin-top:10px}.actions .btn{flex:1}.filters{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.filters button.active{background:var(--navy);color:#fff}.search{width:100%;height:40px;border:1px solid var(--border);border-radius:9px;padding:0 10px;margin-bottom:10px}.tabs{display:flex;gap:4px;overflow:auto;padding:7px 0}.tabs .btn{font-size:11px;white-space:nowrap}.tabs .active{background:var(--navy);color:#fff}.workgroup{margin:12px 0}.work{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #edf0f2}.work input{width:18px;height:18px}.grow{flex:1}.muted{color:var(--muted);font-size:12px}.empty{text-align:center;padding:28px 14px;color:var(--muted)}dialog{border:0;border-radius:14px;padding:0;width:min(94vw,620px);max-height:90dvh;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0b1f3a99}.dlgHead,.dlgFoot{position:sticky;background:#fff;z-index:2;padding:12px;display:flex;align-items:center;justify-content:space-between}.dlgHead{top:0;border-bottom:1px solid var(--border)}.dlgFoot{bottom:0;border-top:1px solid var(--border);gap:8px}.dlgFoot .btn{flex:1}.form{padding:12px;overflow:auto}.field{margin-bottom:10px}.field label{display:block;font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;min-height:40px;border:1px solid var(--border);border-radius:8px;padding:8px;background:#fff}.field textarea{min-height:72px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.notice{padding:9px;border-radius:9px;background:var(--amberSoft);color:#6e470e;margin:8px 0}.saveState{position:fixed;right:10px;bottom:10px;background:var(--navy);color:#fff;padding:6px 9px;border-radius:8px;font-size:10px;display:none;z-index:50}@media(max-width:520px){main{padding:9px}.summary{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.metric{padding:9px}.card{padding:10px}dialog{width:100vw;max-height:94dvh;margin:auto 0 0;border-radius:14px 14px 0 0}}
</style></head><body>
<header class="top"><div class="bar"><div class="brand" id="homeBtn">LIFE PROJECTS</div><button class="btn" id="newProjectBtn">+ NEW</button></div><nav class="nav" id="nav"><button data-view="focus" class="active">FOCUS</button><button data-view="projects">PROJECTS</button><button data-view="review">REVIEW</button><button data-view="more">MORE</button></nav></header>
<main id="app"></main><div class="saveState" id="saveState">SAVED</div>
<dialog id="editor"><div class="dlgHead"><b id="dlgTitle">EDIT</b><button class="btn" onclick="editor.close()">×</button></div><form id="form"><div class="form" id="formBody"></div><div class="dlgFoot"><button type="button" class="btn" onclick="editor.close()">CANCEL</button><button class="btn primary" type="submit">SAVE</button></div></form></dialog>
<script>
'use strict';
const DB_NAME='LifeProjectsDB',DB_VERSION=1,APP_VERSION='1.0',RECOVERY_KEY='lifeProjects.recovery.v1';
const stores=['projects','milestones','workItems','deepWorkSessions','projectLogs','weeklyReviews','settings','recoverySnapshots'];let db,state={view:'focus',projectId:null,projectTab:'focus',filter:'active',search:''};
const $=s=>document.querySelector(s), uuid=()=>crypto.randomUUID(), now=()=>new Date().toISOString(), today=()=>new Date().toISOString().slice(0,10), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function txDone(t){return new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function openDB(){db=await new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{let d=r.result;if(!d.objectStoreNames.contains('projects')){let s=d.createObjectStore('projects',{keyPath:'id'});['status','targetDate','updatedAt','order'].forEach(x=>s.createIndex(x,x));}if(!d.objectStoreNames.contains('milestones')){let s=d.createObjectStore('milestones',{keyPath:'id'});s.createIndex('projectId','projectId');s.createIndex('status','status');s.createIndex('projectId_order',['projectId','order']);}if(!d.objectStoreNames.contains('workItems')){let s=d.createObjectStore('workItems',{keyPath:'id'});['projectId','milestoneId','status','layer'].forEach(x=>s.createIndex(x,x));s.createIndex('projectId_layer_order',['projectId','layer','order']);}if(!d.objectStoreNames.contains('deepWorkSessions')){let s=d.createObjectStore('deepWorkSessions',{keyPath:'id'});['projectId','milestoneId','plannedDate','status'].forEach(x=>s.createIndex(x,x));}if(!d.objectStoreNames.contains('projectLogs')){let s=d.createObjectStore('projectLogs',{keyPath:'id'});['projectId','entryDate','type'].forEach(x=>s.createIndex(x,x));}if(!d.objectStoreNames.contains('weeklyReviews')){let s=d.createObjectStore('weeklyReviews',{keyPath:'id'});s.createIndex('projectId','projectId');s.createIndex('reviewDate','reviewDate');s.createIndex('projectId_reviewDate',['projectId','reviewDate'],{unique:true});}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});if(!d.objectStoreNames.contains('recoverySnapshots')){let s=d.createObjectStore('recoverySnapshots',{keyPath:'id'});s.createIndex('createdAt','createdAt');s.createIndex('reason','reason');}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});await ensureSettings()}
async function all(store){return req(db.transaction(store).objectStore(store).getAll())}async function get(store,id){return req(db.transaction(store).objectStore(store).get(id))}
function normalise(store,x={}){let t=now();if(store==='projects')return{id:x.id||uuid(),title:(x.title||'').trim(),outcome:(x.outcome||'').trim(),whyItMatters:(x.whyItMatters||'').trim(),status:['planned','active','on-hold','completed','archived'].includes(x.status)?x.status:'planned',targetDate:x.targetDate||null,progress:Math.max(0,Math.min(100,+x.progress||0)),currentMilestoneId:x.currentMilestoneId||null,currentObjective:(x.currentObjective||'').trim(),nextOutcome:(x.nextOutcome||'').trim(),nextAction:(x.nextAction||'').trim(),blocker:(x.blocker||'').trim(),deepWorkTargetMinutesPerWeek:Math.max(0,+x.deepWorkTargetMinutesPerWeek||180),notes:(x.notes||'').trim(),order:+x.order||0,createdAt:x.createdAt||t,updatedAt:t,completedAt:x.status==='completed'?(x.completedAt||t):null,archivedAt:x.status==='archived'?(x.archivedAt||t):null};if(store==='milestones')return{id:x.id||uuid(),projectId:x.projectId,title:(x.title||'').trim(),outcome:(x.outcome||'').trim(),status:['not-started','active','completed'].includes(x.status)?x.status:'not-started',targetDate:x.targetDate||null,progress:Math.max(0,Math.min(100,+x.progress||0)),order:+x.order||0,notes:(x.notes||'').trim(),createdAt:x.createdAt||t,updatedAt:t,completedAt:x.status==='completed'?(x.completedAt||t):null};if(store==='workItems')return{id:x.id||uuid(),projectId:x.projectId,milestoneId:x.milestoneId||null,title:(x.title||'').trim(),layer:['now','next','later'].includes(x.layer)?x.layer:'now',status:x.status==='completed'?'completed':'open',estimateMinutes:x.estimateMinutes?+x.estimateMinutes:null,order:+x.order||0,notes:(x.notes||'').trim(),createdAt:x.createdAt||t,updatedAt:t,completedAt:x.status==='completed'?(x.completedAt||t):null};return Object.assign({},x,{id:x.id||uuid(),updatedAt:t,createdAt:x.createdAt||t})}
async function save(store,obj){showSave('SAVING…');let n=normalise(store,obj),t=db.transaction(store,'readwrite');t.objectStore(store).put(n);await txDone(t);let verify=await get(store,n.id);if(!verify)throw Error('Read-back verification failed');await bumpRevision();await mirror();showSave('SAVED');return verify}
async function del(store,id){let t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);await txDone(t);await bumpRevision();await mirror();render()}
async function ensureSettings(){if(!await get('settings','appSettings')){let t=db.transaction('settings','readwrite');t.objectStore('settings').put({key:'appSettings',value:{defaultDeepWorkMinutes:90,defaultWeeklyTargetMinutes:180,weekStartsOn:1,activeProjectWarningLimit:3,showCompletedWork:false,lastBackupAt:null},updatedAt:now()});t.objectStore('settings').put({key:'storageMeta',value:{schemaVersion:1,revision:0,lastSuccessfulWriteAt:null},updatedAt:now()});await txDone(t)}}
async function bumpRevision(){let m=await get('settings','storageMeta');m.value.revision++;m.value.lastSuccessfulWriteAt=now();m.updatedAt=now();let t=db.transaction('settings','readwrite');t.objectStore('settings').put(m);await txDone(t)}
async function snapshotData(){let d={};for(let s of stores.slice(0,7))d[s]=await all(s);return d}async function mirror(){let m=await get('settings','storageMeta'),data=await snapshotData();localStorage.setItem(RECOVERY_KEY,JSON.stringify({formatVersion:1,revision:m.value.revision,savedAt:now(),data}))}
function showSave(t){let e=$('#saveState');e.textContent=t;e.style.display='block';clearTimeout(showSave.x);showSave.x=setTimeout(()=>e.style.display='none',1300)}
function setView(v){state.view=v;state.projectId=null;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
$('#nav').onclick=e=>{if(e.target.dataset.view)setView(e.target.dataset.view)};$('#homeBtn').onclick=()=>setView('focus');$('#newProjectBtn').onclick=()=>editProject();
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'No target';
function weekStart(){let d=new Date(),day=d.getDay(),diff=(day===0?-6:1-day);d.setHours(0,0,0,0);d.setDate(d.getDate()+diff);return d}async function deepThisWeek(projectId){let s=await all('deepWorkSessions'),ws=weekStart();return s.filter(x=>x.projectId===projectId&&x.status==='completed'&&new Date(x.completedAt||x.plannedDate)>=ws).reduce((a,x)=>a+(+x.actualMinutes||0),0)}
async function render(){if(state.projectId)return renderProject();if(state.view==='focus')return renderFocus();if(state.view==='projects')return renderProjects();if(state.view==='review')return renderReview();return renderMore()}
async function renderFocus(){let ps=(await all('projects')).filter(p=>p.status==='active').sort((a,b)=>a.order-b.order),sessions=await all('deepWorkSessions'),mins=0;for(let p of ps)mins+=await deepThisWeek(p.id);let due=0,reviews=await all('weeklyReviews');for(let p of ps){let rs=reviews.filter(r=>r.projectId===p.id).sort((a,b)=>b.reviewDate.localeCompare(a.reviewDate));if(!rs[0]||(Date.now()-new Date(rs[0].reviewDate+'T00:00:00'))/864e5>=7)due++}let h=`<div class="summary"><div class="metric"><b>${ps.length}</b><span>Active projects</span></div><div class="metric"><b>${Math.floor(mins/60)}h ${mins%60}m</b><span>Deep work</span></div><div class="metric"><b>${Math.round(ps.reduce((a,p)=>a+p.deepWorkTargetMinutesPerWeek,0)/60)}h</b><span>Weekly target</span></div><div class="metric"><b>${due}</b><span>Review due</span></div></div>`;if(ps.length>3)h+=`<div class="notice"><b>FOCUS CHECK</b><br>${ps.length} projects are Active. Life Projects works best with 1–3 active projects.</div>`;h+=`<div class="section">ACTIVE PROJECTS</div>`;if(!ps.length)h+=empty('NO BIG PROJECTS YET','Create a project for an outcome that needs sustained focus, milestones and Deep Work.');for(let p of ps){let dw=await deepThisWeek(p.id),next=sessions.filter(x=>x.projectId===p.id&&x.status==='planned'&&x.plannedDate>=today()).sort((a,b)=>a.plannedDate.localeCompare(b.plannedDate))[0];h+=projectCard(p,dw,next)}$('#app').innerHTML=h;wireCards()}
function projectCard(p,dw,next){return`<div class="card ${p.blocker?'blocked':''}" data-open="${p.id}"><div class="row between"><div class="title">${esc(p.title)}</div><b>${p.progress}%</b></div><div class="progress"><i style="width:${p.progress}%"></i></div>${p.currentObjective?`<div class="label">CURRENT</div><div class="value">${esc(p.currentObjective)}</div>`:''}<div class="label">NEXT</div><div class="value">${esc(p.nextAction||'Next action not defined')}</div>${p.blocker?`<div class="label" style="color:var(--red)">BLOCKER</div><div>${esc(p.blocker)}</div>`:''}<div class="label">DEEP WORK</div><div>${dw} / ${p.deepWorkTargetMinutesPerWeek}m this week${next?` · Next ${fmt(next.plannedDate)} ${esc(next.plannedStartTime||'')}`:''}</div><div class="actions"><button class="btn open">OPEN</button><button class="btn deep" data-deep="${p.id}">PLAN WORK</button></div></div>`}
function wireCards(){document.querySelectorAll('.open').forEach(b=>b.onclick=e=>{e.stopPropagation();state.projectId=b.closest('[data-open]').dataset.open;state.projectTab='focus';render()});document.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>{state.projectId=c.dataset.open;state.projectTab='focus';render()});document.querySelectorAll('.deep').forEach(b=>b.onclick=e=>{e.stopPropagation();editDeep(b.dataset.deep)})}
async function renderProjects(){let ps=(await all('projects')).filter(p=>p.status===state.filter&&p.title.toLowerCase().includes(state.search.toLowerCase()));let h=`<input class="search" id="search" placeholder="Search projects…" value="${esc(state.search)}"><div class="filters">${['active','planned','on-hold','completed'].map(x=>`<button class="btn ${state.filter===x?'active':''}" data-filter="${x}">${x.replace('-',' ').toUpperCase()}</button>`).join('')}</div>`;h+=ps.length?ps.map(p=>`<div class="card" data-open="${p.id}"><div class="row between"><div class="title">${esc(p.title)}</div><span class="pill">${p.progress}%</span></div><div class="muted">${esc(p.outcome||'No outcome defined')} · ${fmt(p.targetDate)}</div></div>`).join(''):empty('NO PROJECTS','No projects match this view.');$('#app').innerHTML=h;$('#search').oninput=e=>{state.search=e.target.value;renderProjects()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;renderProjects()});wireCards()}
async function renderProject(){let p=await get('projects',state.projectId);if(!p){state.projectId=null;return render()}let h=`<button class="btn" id="back">← BACK</button><div class="card"><div class="row between"><div><div class="title">${esc(p.title)}</div><div class="muted">${p.status.toUpperCase()} · TARGET ${fmt(p.targetDate)}</div></div><b>${p.progress}%</b></div><div class="progress"><i style="width:${p.progress}%"></i></div><div class="tabs">${['focus','roadmap','work','history'].map(x=>`<button class="btn ${state.projectTab===x?'active':''}" data-tab="${x}">${x.toUpperCase()}</button>`).join('')}</div></div><div id="projectBody"></div>`;$('#app').innerHTML=h;$('#back').onclick=()=>{state.projectId=null;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.projectTab=b.dataset.tab;renderProject()});if(state.projectTab==='focus')await projectFocus(p);if(state.projectTab==='roadmap')await projectRoadmap(p);if(state.projectTab==='work')await projectWork(p);if(state.projectTab==='history')await projectHistory(p)}
async function projectFocus(p){let ms=await all('milestones'),m=ms.find(x=>x.id===p.currentMilestoneId),dw=await deepThisWeek(p.id);$('#projectBody').innerHTML=`<div class="card"><div class="label">OUTCOME</div><div>${esc(p.outcome||'Not defined')}</div><div class="label">CURRENT MILESTONE</div><div>${esc(m?.title||'Not defined')}</div><div class="label">CURRENT OBJECTIVE</div><div>${esc(p.currentObjective||'Not defined')}</div><div class="label">NEXT OUTCOME</div><div>${esc(p.nextOutcome||'Not defined')}</div><div class="label">NEXT ACTION</div><div>${esc(p.nextAction||'Not defined')}</div>${p.blocker?`<div class="label" style="color:var(--red)">BLOCKER</div><div>${esc(p.blocker)}</div>`:''}<div class="label">DEEP WORK THIS WEEK</div><div>${dw} / ${p.deepWorkTargetMinutesPerWeek} minutes</div><div class="progress"><i style="width:${Math.min(100,dw/(p.deepWorkTargetMinutesPerWeek||1)*100)}%"></i></div><div class="actions"><button class="btn" id="editP">EDIT PROJECT</button><button class="btn primary" id="planD">PLAN DEEP WORK</button></div></div>`;$('#editP').onclick=()=>editProject(p);$('#planD').onclick=()=>editDeep(p.id)}
async function projectRoadmap(p){let ms=(await all('milestones')).filter(x=>x.projectId===p.id).sort((a,b)=>a.order-b.order);$('#projectBody').innerHTML=`<div class="row between"><div class="section">ROADMAP</div><button class="btn" id="addM">+ ADD MILESTONE</button></div>${ms.map(m=>`<div class="card" data-m="${m.id}"><div class="row"><span>${m.status==='completed'?'✓':m.status==='active'?'●':'○'}</span><div class="grow"><b>${esc(m.title)}</b><div class="muted">${esc(m.outcome||'')} ${m.targetDate?'· '+fmt(m.targetDate):''}</div></div><span>${m.progress}%</span></div></div>`).join('')||empty('NO MILESTONES','Add the major stages required to achieve this project outcome.')}`;$('#addM').onclick=()=>editMilestone(p.id);document.querySelectorAll('[data-m]').forEach(e=>e.onclick=async()=>editMilestone(p.id,await get('milestones',e.dataset.m)))}
async function projectWork(p){let ws=(await all('workItems')).filter(x=>x.projectId===p.id),h=`<div class="row between"><div class="section">PROJECT WORK</div><button class="btn" id="addW">+ ADD WORK</button></div>`;for(let layer of ['now','next','later']){let arr=ws.filter(x=>x.status==='open'&&x.layer===layer).sort((a,b)=>a.order-b.order);h+=`<div class="workgroup"><div class="section">${layer.toUpperCase()} ${arr.length}</div>${arr.map(w=>`<div class="work"><input type="checkbox" data-done="${w.id}"><div class="grow" data-w="${w.id}"><b>${esc(w.title)}</b>${w.estimateMinutes?`<div class="muted">${w.estimateMinutes}m</div>`:''}</div></div>`).join('')||'<div class="muted">No work here.</div>'}</div>`}h+=`<div class="section">COMPLETED ${ws.filter(x=>x.status==='completed').length}</div>`;$('#projectBody').innerHTML=h;$('#addW').onclick=()=>editWork(p.id);document.querySelectorAll('[data-w]').forEach(e=>e.onclick=async()=>editWork(p.id,await get('workItems',e.dataset.w)));document.querySelectorAll('[data-done]').forEach(c=>c.onchange=async()=>{let w=await get('workItems',c.dataset.done);w.status='completed';await save('workItems',w);renderProject()})}
async function projectHistory(p){let logs=(await all('projectLogs')).filter(x=>x.projectId===p.id).map(x=>({date:x.entryDate,type:x.type,text:x.text})),ds=(await all('deepWorkSessions')).filter(x=>x.projectId===p.id&&x.status==='completed').map(x=>({date:(x.completedAt||x.plannedDate).slice(0,10),type:'deep work',text:`${x.actualMinutes||0}m · ${x.result||x.objective}`})),rs=(await all('weeklyReviews')).filter(x=>x.projectId===p.id).map(x=>({date:x.reviewDate,type:'weekly review',text:x.progressSummary||x.nextWeekOutcome||'Review completed'}));let a=[...logs,...ds,...rs].sort((a,b)=>b.date.localeCompare(a.date));$('#projectBody').innerHTML=`<div class="row between"><div class="section">HISTORY</div><button class="btn" id="addL">+ LOG</button></div>${a.map(x=>`<div class="card"><div class="meta">${fmt(x.date)} · ${esc(x.type).toUpperCase()}</div><div>${esc(x.text)}</div></div>`).join('')||empty('NO HISTORY','Project decisions, Deep Work and reviews will appear here.')}`;$('#addL').onclick=()=>editLog(p.id)}
async function renderReview(){let ps=(await all('projects')).filter(x=>x.status==='active'),rs=await all('weeklyReviews'),h=`<div class="section">WEEKLY REVIEW</div>`;for(let p of ps){let r=rs.filter(x=>x.projectId===p.id).sort((a,b)=>b.reviewDate.localeCompare(a.reviewDate))[0],days=r?Math.floor((Date.now()-new Date(r.reviewDate+'T00:00:00'))/864e5):999;h+=`<div class="card"><div class="row between"><div><b>${esc(p.title)}</b><div class="muted">${r?'Last reviewed '+days+' days ago':'Never reviewed'}</div></div><button class="btn ${days>=7?'primary':''}" data-review="${p.id}">REVIEW</button></div></div>`}$('#app').innerHTML=h||empty('NO ACTIVE PROJECTS','Activate a project to include it in weekly review.');document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>editReview(b.dataset.review))}
async function renderMore(){let m=await get('settings','storageMeta');$('#app').innerHTML=`<div class="section">DATA & SETTINGS</div><div class="card"><b>Life Projects V${APP_VERSION}</b><div class="muted">LifeProjectsDB v${DB_VERSION} · Revision ${m.value.revision}</div></div><div class="card"><div class="actions"><button class="btn primary" id="backup">QUICK BACKUP</button><label class="btn" style="text-align:center">RESTORE BACKUP<input hidden type="file" id="restore" accept="application/json"></label></div></div><div class="card"><b>Recovery</b><div class="muted">A compact verified-style recovery mirror is refreshed after successful writes.</div><div class="actions"><button class="btn" id="restoreMirror">RESTORE RECOVERY MIRROR</button></div></div>`;$('#backup').onclick=backup;$('#restore').onchange=e=>restoreFile(e.target.files[0]);$('#restoreMirror').onclick=restoreMirror}
function empty(t,s){return`<div class="card empty"><b>${t}</b><p>${s}</p></div>`}
function openForm(title,html,onSubmit){$('#dlgTitle').textContent=title;$('#formBody').innerHTML=html;$('#form').onsubmit=async e=>{e.preventDefault();try{await onSubmit(new FormData(e.target));editor.close();render()}catch(err){alert(err.message)}};editor.showModal()}
async function editProject(p={}){let ms=p.id?(await all('milestones')).filter(x=>x.projectId===p.id):[];openForm(p.id?'EDIT PROJECT':'NEW PROJECT',`<div class="field"><label>Project title *</label><input name="title" required value="${esc(p.title||'')}"></div><div class="field"><label>Desired outcome</label><textarea name="outcome">${esc(p.outcome||'')}</textarea></div><div class="field"><label>Why it matters</label><textarea name="whyItMatters">${esc(p.whyItMatters||'')}</textarea></div><div class="grid2"><div class="field"><label>Status</label><select name="status">${['planned','active','on-hold','completed','archived'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Target date</label><input type="date" name="targetDate" value="${p.targetDate||''}"></div></div>${p.id?`<div class="grid2"><div class="field"><label>Progress %</label><input type="number" min="0" max="100" name="progress" value="${p.progress||0}"></div><div class="field"><label>Current milestone</label><select name="currentMilestoneId"><option value="">None</option>${ms.map(m=>`<option value="${m.id}" ${p.currentMilestoneId===m.id?'selected':''}>${esc(m.title)}</option>`).join('')}</select></div></div><div class="field"><label>Current objective</label><input name="currentObjective" value="${esc(p.currentObjective||'')}"></div><div class="field"><label>Next outcome</label><input name="nextOutcome" value="${esc(p.nextOutcome||'')}"></div><div class="field"><label>Next action</label><input name="nextAction" value="${esc(p.nextAction||'')}"></div><div class="field"><label>Blocker</label><input name="blocker" value="${esc(p.blocker||'')}"></div><div class="field"><label>Weekly Deep Work target (minutes)</label><input type="number" name="deepWorkTargetMinutesPerWeek" value="${p.deepWorkTargetMinutesPerWeek||180}"></div>`:''}`,async f=>{let o=Object.assign({},p,Object.fromEntries(f));if(!o.title.trim())throw Error('Project title is required');let saved=await save('projects',o);state.projectId=saved.id;state.projectTab='focus'})}
function editMilestone(projectId,m={}){openForm(m.id?'EDIT MILESTONE':'ADD MILESTONE',`<div class="field"><label>Title *</label><input name="title" required value="${esc(m.title||'')}"></div><div class="field"><label>Outcome</label><textarea name="outcome">${esc(m.outcome||'')}</textarea></div><div class="grid2"><div class="field"><label>Status</label><select name="status">${['not-started','active','completed'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Progress %</label><input type="number" min="0" max="100" name="progress" value="${m.progress||0}"></div></div><div class="field"><label>Target date</label><input type="date" name="targetDate" value="${m.targetDate||''}"></div>`,async f=>save('milestones',Object.assign({},m,Object.fromEntries(f),{projectId,order:m.order??Date.now()})))}
async function editWork(projectId,w={}){let ms=(await all('milestones')).filter(x=>x.projectId===projectId);openForm(w.id?'EDIT WORK':'ADD WORK',`<div class="field"><label>Title *</label><input required name="title" value="${esc(w.title||'')}"></div><div class="grid2"><div class="field"><label>Layer</label><select name="layer">${['now','next','later'].map(x=>`<option ${w.layer===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Estimate minutes</label><input type="number" name="estimateMinutes" value="${w.estimateMinutes||''}"></div></div><div class="field"><label>Milestone</label><select name="milestoneId"><option value="">No milestone</option>${ms.map(m=>`<option value="${m.id}" ${w.milestoneId===m.id?'selected':''}>${esc(m.title)}</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea name="notes">${esc(w.notes||'')}</textarea></div>`,async f=>save('workItems',Object.assign({},w,Object.fromEntries(f),{projectId,status:w.status||'open',order:w.order??Date.now()})))}
async function editDeep(projectId){let ms=(await all('milestones')).filter(x=>x.projectId===projectId);openForm('PLAN DEEP WORK',`<div class="field"><label>Objective *</label><input required name="objective"></div><div class="field"><label>Milestone</label><select name="milestoneId"><option value="">No milestone</option>${ms.map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Date *</label><input required type="date" name="plannedDate" value="${today()}"></div><div class="field"><label>Start</label><input type="time" name="plannedStartTime"></div></div><div class="field"><label>Planned minutes *</label><input required type="number" name="plannedMinutes" value="90"></div>`,async f=>{let o=Object.fromEntries(f);await save('deepWorkSessions',{...o,projectId,status:'planned',plannedMinutes:+o.plannedMinutes,title:o.objective,result:'',nextAction:'',notes:''})})}
function editLog(projectId){openForm('ADD PROJECT LOG',`<div class="field"><label>Type</label><select name="type">${['note','progress','decision','blocker','milestone'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="entryDate" value="${today()}"></div><div class="field"><label>Note *</label><textarea required name="text"></textarea></div>`,async f=>save('projectLogs',{...Object.fromEntries(f),projectId,sourceType:'manual',sourceId:null}))}
async function editReview(projectId){let p=await get('projects',projectId),actual=await deepThisWeek(projectId);openForm('WEEKLY REVIEW',`<div class="field"><label>Review date</label><input type="date" name="reviewDate" value="${today()}"></div><div class="field"><label>Progress summary</label><textarea name="progressSummary"></textarea></div><div class="field"><label>Biggest progress</label><textarea name="biggestProgress"></textarea></div><div class="field"><label>Blocker</label><input name="blocker" value="${esc(p.blocker||'')}"></div><div class="field"><label>Next week's outcome</label><textarea name="nextWeekOutcome"></textarea></div><div class="field"><label>Deep Work target minutes</label><input type="number" name="deepWorkTargetMinutes" value="${p.deepWorkTargetMinutesPerWeek}"></div><div class="muted">Actual Deep Work this week: ${actual} minutes · Progress snapshot: ${p.progress}%</div>`,async f=>save('weeklyReviews',{...Object.fromEntries(f),projectId,projectProgress:p.progress,actualDeepWorkMinutes:actual}))}
async function backup(){let data=await snapshotData(),m=await get('settings','storageMeta'),payload={type:'life-projects-backup',formatVersion:1,dataModelVersion:1,exportedAt:now(),app:{name:'Life Projects',version:APP_VERSION,database:DB_NAME,databaseVersion:DB_VERSION},metadata:{revision:m.value.revision},data};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`life-projects-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
async function restoreFile(file){if(!file)return;try{let p=JSON.parse(await file.text());if(p.type!=='life-projects-backup'||p.formatVersion!==1)throw Error('Invalid Life Projects backup');if(!confirm('Restore and replace all Life Projects data?'))return;await replaceData(p.data);alert('Restore completed and verified.')}catch(e){alert('Restore failed: '+e.message)}}
async function replaceData(data){let names=stores.slice(0,7),t=db.transaction(names,'readwrite');for(let s of names){let os=t.objectStore(s);os.clear();for(let x of (data[s]||[]))os.put(x)}await txDone(t);await ensureSettings();await mirror();render()}
async function restoreMirror(){let raw=localStorage.getItem(RECOVERY_KEY);if(!raw)return alert('No recovery mirror found.');let p=JSON.parse(raw);if(confirm(`Restore recovery revision ${p.revision}? This replaces current data.`))await replaceData(p.data)}
openDB().then(render).catch(e=>{$('#app').innerHTML=`<div class="notice"><b>STARTUP ERROR</b><br>${esc(e.message)}</div>`});
</script></body></html>
